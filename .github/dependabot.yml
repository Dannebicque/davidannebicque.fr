version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*']
      tests:
        patterns: ['@playwright/*', '@axe-core/*', 'eslint*', 'typescript', 'vue-tsc']
    ignore:
      # Nuxt 4 : migration à faire à part
      - dependency-name: nuxt
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
