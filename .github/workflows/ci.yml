name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Types (vue-tsc)
        run: npm run typecheck

      - name: Build statique
        run: npm run generate

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests (axe WCAG 2.2 AA, clavier, SEO, formulaire)
        run: npm test

      - name: Lighthouse (performance, accessibilité, bonnes pratiques, SEO)
        run: npm run lighthouse

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
